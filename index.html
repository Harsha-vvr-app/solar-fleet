<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Fleet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23E09A12'/%3E%3Cg stroke='%23E09A12' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261028b">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand"><span class="sun" aria-hidden="true"></span><span>Solar Fleet</span></div>
      <p class="muted">Sign in with the username and password you were given.</p>
      <label for="login-user">Username</label>
      <input id="login-user" name="username" autocomplete="username" required>
      <label for="login-pass">Password</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary">Sign in</button>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <nav class="side" aria-label="Main">
      <div class="brand"><span class="sun" aria-hidden="true"></span><span>Solar Fleet</span></div>
      <a href="#overview" data-route="overview">Overview</a>
      <a href="#tickets" data-route="tickets">Tickets <span class="count" id="nav-tickets"></span></a>
      <a href="#bills" data-route="bills">EB bills <span class="count" id="nav-bills"></span></a>
      <a href="#grid" data-route="grid">Daylight grid import</a>
      <a href="#sites" data-route="sites">Sites</a>
      <a href="#systems" data-route="systems">Systems</a>
      <a href="#planned" data-route="planned">Planned work</a>
      <a href="#bulk" data-route="bulk">Bulk upload</a>
      <a href="#settings" data-route="settings">Settings</a>
      <a href="#users" data-route="users">Users</a>
      <div class="side-foot">
        <span id="who"></span>
        <button type="button" class="link" id="signout">Sign out</button>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"></dialog>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/d3-7.9.0.min.js"></script>
  <script src="config.js?v=20261028b"></script>
  <script src="app.js?v=20261028b"></script>
</body>
</html>
